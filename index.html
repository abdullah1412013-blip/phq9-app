<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقياس الصحة النفسية (PHQ-9) - التغطية المباشرة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --bg-dark: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --accent: #6366f1; }
    * { box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { margin: 0; font-size: 1.6rem; color: #818cf8; }
    .grid-layout { display: grid; grid-template-columns: 280px 1fr; gap: 15px; max-width: 1100px; margin: 0 auto; }
    @media (max-width: 850px) { .grid-layout { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); border-radius: 16px; padding: 18px; border: 1px solid #334155; }
    .qr-panel { text-align: center; }
    #qrcode { display: inline-block; margin: 10px 0; padding: 8px; background: #fff; border-radius: 12px; }
    .counter-badge { font-size: 2.4rem; font-weight: 800; color: #38bdf8; margin: 5px 0; }
    .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 650px) { .charts-container { grid-template-columns: 1fr; } }
    .chart-box { position: relative; height: 250px; width: 100%; }
    .form-panel { grid-column: 1 / -1; margin-top: 10px; background: #182234; }
    .q-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #334155; }
    .btn-group button { background: #334155; color: #fff; border: none; padding: 6px 10px; margin-left: 2px; border-radius: 6px; cursor: pointer; }
    .btn-group button.active { background: var(--accent); font-weight: bold; }
    .submit-btn { width: 100%; background: #10b981; color: white; font-size: 1.1rem; font-weight: bold; padding: 12px; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; }
    .reset-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 0.8rem; }
    .status-badge { background: #10b981; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="header">
  <h1>📊 التغطية التفاعلية المباشرة - مقياس (PHQ-9)</h1>
  <div class="status-badge" id="netStatus">⚡ الربط السحابي متصل ويعمل بين الشاشة والجوالات</div>
</div>

<div class="grid-layout">
  <div class="card qr-panel">
    <h3>إجمالي المشاركين</h3>
    <div id="participantCount" class="counter-badge">0</div>
    <p style="color:#94a3b8; font-size:0.85rem;">مشارك في القاعة الآن</p>
    <hr style="border-color:#334155; margin: 10px 0;">
    <p style="font-size:0.8rem; color:#cbd5e1;">امسح الكود من جوالك للمشاركة:</p>
    <div id="qrcode"></div>
    <br>
    <button class="reset-btn" onclick="clearData()">تصفير النتائج لتجربة جديدة 🔄</button>
  </div>

  <div class="card">
    <div class="charts-container">
      <div>
        <h4 style="text-align:center; margin-top:0;">توزيع مستويات الاكتئاب</h4>
        <div class="chart-box"><canvas id="donutChart"></canvas></div>
      </div>
      <div>
        <h4 style="text-align:center; margin-top:0;">متوسط الأعراض لكل سؤال</h4>
        <div class="chart-box"><canvas id="barChart"></canvas></div>
      </div>
    </div>
  </div>

  <div class="card form-panel">
    <h3 style="color:#38bdf8; margin-top:0;">📝 نموذج المشاركة (اختر الإجابات واضغط إرسال)</h3>
    <div id="questionsContainer"></div>
    <button class="submit-btn" id="subBtn" onclick="submitResponse()">إرسال النتيجة للشاشة المباشرة 🚀</button>
  </div>
</div>

<script>
  // قناة حقيقية موحدة للتزامن الفوري بين أي جوال وشاشة الكمبيوتر
  const DB_ENDPOINT = "https://keyvalue.imkey.store/api/v1/phq9_live_survey_2026";

  let currentAnswers = new Array(9).fill(0);
  const questions = [
    "1. فقدت الرغبة والأنس بالأمور المعتادة", "2. الشعور بالحزن أو الضيق",
    "3. صعوبات في النوم أو البقاء نائماً", "4. الشعور بالخمول والكسل",
    "5. فقدان الشهية أو الأكل بشراهة", "6. الشعور بالسوء تجاه النفس",
    "7. صعوبة في التركيز", "8. البطء في الحركة/التحدث أو التوتر",
    "9. التفكير بأن الحياة لا تستحق العيش"
  ];

  new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 110, height: 110 });

  const qContainer = document.getElementById("questionsContainer");
  questions.forEach((q, qIdx) => {
    const row = document.createElement("div");
    row.className = "q-row";
    row.innerHTML = `
      <span style="font-size:0.9rem;">${q}</span>
      <div class="btn-group">
        <button class="active" onclick="setVal(${qIdx}, 0, this)">0: أبداً</button>
        <button onclick="setVal(${qIdx}, 1, this)">1: قليلاً</button>
        <button onclick="setVal(${qIdx}, 2, this)">2: أحياناً</button>
        <button onclick="setVal(${qIdx}, 3, this)">3: غالباً</button>
      </div>
    `;
    qContainer.appendChild(row);
  });

  function setVal(qIdx, val, btn) {
    currentAnswers[qIdx] = Number(val);
    btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  const donutChart = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: {
      labels: ['طبيعي/خفيف (0-4)', 'طفيف (5-9)', 'متوسط (10-14)', 'شديد متوسط (15-19)', 'شديد جداً (20-27)'],
      datasets: [{ data: [0, 0, 0, 0, 0], backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#f97316', '#ef4444'] }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#f8fafc' } } } }
  });

  const barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: ['س1', 'س2', 'س3', 'س4', 'س5', 'س6', 'س7', 'س8', 'س9'],
      datasets: [{ label: 'متوسط النقاط', data: [0, 0, 0, 0, 0, 0, 0, 0, 0], backgroundColor: '#818cf8' }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 3, ticks: { color: '#94a3b8' } }, x: { ticks: { color: '#94a3b8' } } }, plugins: { legend: { display: false } } }
  });

  async function getRemoteData() {
    try {
      const res = await fetch(DB_ENDPOINT);
      if(!res.ok) return [];
      const json = await res.json();
      return Array.isArray(json) ? json : [];
    } catch (e) {
      return [];
    }
  }

  async function submitResponse() {
    const btn = document.getElementById("subBtn");
    btn.disabled = true;
    btn.innerText = "جاري الإرسال للشاشة المباشرة...";

    try {
      let list = await getRemoteData();
      list.push([...currentAnswers]);

      await fetch(DB_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(list)
      });

      alert("✅ تم إرسال مشاركتك للسحاب! ستشاهدين المخطط البياني يتحدث على الكمبيوتر فوراً.");
      renderDashboard(list);
    } catch (e) {
      alert("تعذر الاتصال، يرجى التأكد من اتصال الإنترنت.");
    } finally {
      btn.disabled = false;
      btn.innerText = "إرسال النتيجة للشاشة المباشرة 🚀";
    }
  }

  async function syncLoop() {
    const data = await getRemoteData();
    renderDashboard(data);
  }

  function renderDashboard(responseList) {
    document.getElementById("participantCount").innerText = responseList.length;
    let levels = [0, 0, 0, 0, 0];
    let qSums = new Array(9).fill(0);

    responseList.forEach(res => {
      if (Array.isArray(res) && res.length === 9) {
        const sum = res.reduce((a, b) => Number(a) + Number(b), 0);
        if (sum <= 4) levels[0]++;
        else if (sum <= 9) levels[1]++;
        else if (sum <= 14) levels[2]++;
        else if (sum <= 19) levels[3]++;
        else levels[4]++;

        res.forEach((val, idx) => { qSums[idx] += Number(val); });
      }
    });

    donutChart.data.datasets[0].data = levels;
    donutChart.update();

    const count = responseList.length || 1;
    barChart.data.datasets[0].data = qSums.map(s => (s / count).toFixed(1));
    barChart.update();
  }

  async function clearData() {
    if (confirm("هل تريدين تصفير وإلغاء جميع النتائج من السحاب؟")) {
      try {
        await fetch(DB_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify([])
        });
      } catch (e) {}
      syncLoop();
    }
  }

  syncLoop();
  setInterval(syncLoop, 1500); // يفحص السحاب كل ثانية ونصف لتحديث الكمبيوتر تلقائياً
</script>
</body>
</html>
