<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقياس الصحة النفسية (PHQ-9)</title>
  <style>
    :root { --bg-dark: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --accent: #6366f1; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 1.8rem; color: #818cf8; }
    .grid-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
    @media (max-width: 850px) { .grid-layout { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid #334155; }
    .counter-badge { font-size: 3rem; font-weight: 800; color: #38bdf8; text-align: center; margin: 10px 0; }
    .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 650px) { .charts-container { grid-template-columns: 1fr; } }
    .chart-box { text-align: center; }
    canvas { background: #0f172a; border-radius: 12px; padding: 10px; max-width: 100%; }
    .form-panel { grid-column: 1 / -1; margin-top: 10px; background: #182234; }
    .q-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; }
    .btn-group button { background: #334155; color: #fff; border: none; padding: 8px 12px; margin-left: 4px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .btn-group button.active { background: var(--accent); font-weight: bold; }
    .submit-btn { width: 100%; background: #10b981; color: white; font-size: 1.2rem; font-weight: bold; padding: 14px; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; }
    .reset-btn { width: 100%; background: #ef4444; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin-top: 15px; }
    .status-badge { background: #10b981; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="header">
  <h1>📊 مقياس الصحة النفسية (PHQ-9) - لوحة العرض المباشرة</h1>
  <div class="status-badge">⚡ جاهز للعرض والمشاركة المباشرة</div>
</div>

<div class="grid-layout">
  <div class="card" style="text-align: center;">
    <h3 style="margin-top:0;">إجمالي المشاركين</h3>
    <div id="participantCount" class="counter-badge">0</div>
    <p style="color:#94a3b8; font-size:0.9rem;">إجابة مسجلة في الجلسة</p>
    <button class="reset-btn" onclick="clearData()">تصفير النتائج 🔄</button>
  </div>

  <div class="card">
    <div class="charts-container">
      <div class="chart-box">
        <h4 style="margin-top:0; color:#cbd5e1;">توزيع المستويات</h4>
        <canvas id="pieCanvas" width="220" height="220"></canvas>
      </div>
      <div class="chart-box">
        <h4 style="margin-top:0; color:#cbd5e1;">متوسط نقاط الأسئلة</h4>
        <canvas id="barCanvas" width="250" height="220"></canvas>
      </div>
    </div>
  </div>

  <div class="card form-panel">
    <h3 style="color:#38bdf8; margin-top:0;">📝 إدخال إجابة جديدة (اختر الإجابات واضغط إرسال)</h3>
    <div id="questionsContainer"></div>
    <button class="submit-btn" onclick="submitResponse()">إرسال النتيجة وتحديث الشاشة 🚀</button>
  </div>
</div>

<script>
  let currentAnswers = new Array(9).fill(0);
  const questions = [
    "1. فقدت الرغبة والأنس بالأمور المعتادة", "2. الشعور بالحزن أو الضيق",
    "3. صعوبات في النوم أو البقاء نائماً", "4. الشعور بالخمول والكسل",
    "5. فقدان الشهية أو الأكل بشراهة", "6. الشعور بالسوء تجاه النفس",
    "7. صعوبة في التركيز", "8. البطء في الحركة/التحدث أو التوتر",
    "9. التفكير بأن الحياة لا تستحق العيش"
  ];

  const qContainer = document.getElementById("questionsContainer");
  questions.forEach((q, qIdx) => {
    const row = document.createElement("div");
    row.className = "q-row";
    row.innerHTML = `
      <span style="font-size:0.95rem;">${q}</span>
      <div class="btn-group">
        <button class="active" onclick="setVal(${qIdx}, 0, this)">0: أبداً</button>
        <button onclick="setVal(${qIdx}, 1, this)">1: قليلاً</button>
        <button onclick="setVal(${qIdx}, 2, this)">2: أحياناً</button>
        <button onclick="setVal(${qIdx}, 3, this)">3: غالباً</button>
      </div>
    `;
    qContainer.appendChild(row);
  });

  function setVal(qIdx, val, btn) {
    currentAnswers[qIdx] = Number(val);
    btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function getStoredData() {
    return JSON.parse(localStorage.getItem("phq9_offline_data") || "[]");
  }

  function submitResponse() {
    let list = getStoredData();
    list.push([...currentAnswers]);
    localStorage.setItem("phq9_offline_data", JSON.stringify(list));
    renderAll(list);
    alert("✅ تم تسجيل الإجابة وتحديث الرسم البياني بنجاح!");
  }

  function clearData() {
    if (confirm("هل أنتِ متأكدة من تصفير جميع النتائج؟")) {
      localStorage.removeItem("phq9_offline_data");
      renderAll([]);
    }
  }

  function renderAll(list) {
    document.getElementById("participantCount").innerText = list.length;
    
    let levels = [0, 0, 0, 0, 0];
    let qSums = new Array(9).fill(0);

    list.forEach(res => {
      if (Array.isArray(res) && res.length === 9) {
        const sum = res.reduce((a, b) => Number(a) + Number(b), 0);
        if (sum <= 4) levels[0]++;
        else if (sum <= 9) levels[1]++;
        else if (sum <= 14) levels[2]++;
        else if (sum <= 19) levels[3]++;
        else levels[4]++;

        res.forEach((val, idx) => { qSums[idx] += Number(val); });
      }
    });

    drawPieChart(levels, list.length);
    drawBarChart(qSums, list.length);
  }

  function drawPieChart(levels, total) {
    const canvas = document.getElementById("pieCanvas");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (total === 0) {
      ctx.fillStyle = "#475569";
      ctx.beginPath();
      ctx.arc(110, 110, 80, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("لا توجد بيانات", 110, 115);
      return;
    }

    const colors = ['#10b981', '#3b82f6', '#f59e0b', '#f97316', '#ef4444'];
    let startAngle = 0;

    levels.forEach((val, i) => {
      if (val === 0) return;
      let sliceAngle = (val / total) * 2 * Math.PI;
      ctx.fillStyle = colors[i];
      ctx.beginPath();
      ctx.moveTo(110, 110);
      ctx.arc(110, 110, 80, startAngle, startAngle + sliceAngle);
      ctx.closePath();
      ctx.fill();
      startAngle += sliceAngle;
    });
  }

  function drawBarChart(qSums, total) {
    const canvas = document.getElementById("barCanvas");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const count = total || 1;
    const barWidth = 18;
    const startX = 20;

    qSums.forEach((sum, i) => {
      let avg = sum / count;
      let barHeight = (avg / 3) * 140;
      let x = startX + (i * 24);
      let y = 180 - barHeight;

      ctx.fillStyle = "#818cf8";
      ctx.fillRect(x, y, barWidth, barHeight);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("س" + (i + 1), x + (barWidth / 2), 198);
    });
  }

  renderAll(getStoredData());
</script>
</body>
</html>
